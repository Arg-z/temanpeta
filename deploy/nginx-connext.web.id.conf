# TemanPeta — connext.web.id = LANDING PAGE (statis).
# Aplikasi pindah ke app.connext.web.id (lihat nginx-app.connext.web.id.conf).
# File ini adalah SUMBER KEBENARAN konfigurasi live di
# /etc/nginx/sites-available/connext.web.id — jangan biarkan menyimpang.
# Blok yang bertanda "managed by Certbot" dikelola certbot di host;
# setup-split.sh memasang versi pra-TLS di sini lalu membiarkan certbot
# menambahkan blok TLS, kemudian men-snapshot hasil live kembali ke file ini.
#
# Landing dilayani langsung dari temanpeta/landing/ (file milik arga,
# world-readable) — edit landing tidak butuh sudo maupun reload nginx.
# Catatan: path live lama /home/arga/landing-temanpeta kini symlink ke
# folder ini, jadi config yang masih menunjuk ke sana tetap berfungsi.
#
# Catatan CSP: landing memakai <style> inline (semua CSS ada di head) dan
# script eksternal landing.js, jadi style-src butuh 'unsafe-inline' sementara
# script-src tetap ketat 'self'. Landing tidak memakai geolocation.

server {
    server_name connext.web.id;

    # Security headers (scoped ke site ini saja; situs lain tidak terpengaruh)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    root /home/arga/temanpeta/landing;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 512;

    # Jalur validasi Let's Encrypt (HTTP-01) harus lolos — `^~` supaya
    # regex deny dotfiles di bawah tidak ikut memblokirnya.
    location ^~ /.well-known/acme-challenge/ { }

    # Dotfiles (.git, .env, dst.) tidak mungkin ada di dir landing, tapi
    # ditolak eksplisit mengikuti semangat hardening conf.d-00-hardening.conf.
    location ~ /\. { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/connext.web.id/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/connext.web.id/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = connext.web.id) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name connext.web.id;

    listen [::]:80 ipv6only=on;
    listen 80;
    return 404; # managed by Certbot


}