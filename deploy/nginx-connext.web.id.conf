# TemanPeta — connext.web.id (nginx di host)
# File ini adalah SUMBER KEBENARAN konfigurasi live di
# /etc/nginx/sites-available/connext.web.id — jangan biarkan menyimpang.
# Blok yang bertanda "managed by Certbot" dikelola certbot di host;
# snapshot di sini hanya agar redeploy tidak menghilangkan headers/TLS.
#
# Perubahan dari versi pra-hardening:
# - Security headers (HSTS, CSP, dll.) selalu diset untuk site ini.
# - X-Forwarded-For di-OVERWRITE dengan $remote_addr (bukan append): rantai
#   XFF buatan klien dibuang, sehingga rate-limit per-IP di backend tidak
#   bisa dipalsukan (CWE-348). Backend memakai `trust proxy 2` (nginx+Caddy).

server {
    server_name connext.web.id;

    # Security headers (scoped ke site ini saja; situs lain tidak terpengaruh)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' wss: https://tiles.openfreemap.org; img-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Semua trafik (static, /api/*, /ws) diteruskan ke Caddy di container.
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (bukan $proxy_add_x_forwarded_for): klien tidak boleh
        # menyuntik entri XFF sendiri.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket (/ws)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/connext.web.id/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/connext.web.id/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = connext.web.id) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name connext.web.id;
    return 404; # managed by Certbot


}
