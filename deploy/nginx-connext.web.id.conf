# TemanPeta — connext.web.id
# HTTPS akan ditambahkan otomatis oleh certbot (setup-https.sh);
# sebelum itu site ini hidup di HTTP.

server {
    listen 80;
    listen [::]:80;
    server_name connext.web.id;

    # Semua trafik (static, /api/*, /ws) diteruskan ke Caddy di container.
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket (/ws)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
